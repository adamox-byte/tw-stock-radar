name: TW Stock Weekend & After-Hours Radar

on:
  schedule:
    - cron: '0 1 * * 6'
    - cron: '30 12 * * 0'
  workflow_dispatch:

concurrency:
  group: tw-stock-weekend-radar
  cancel-in-progress: true

jobs:
  run-weekend-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v4

      - name: 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝富果與網路套件
        run: |
          pip install fugle-marketdata requests tzdata

      - name: 啟動週末復盤與期望值備戰系統
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cat << 'EOF' > run_weekend.py
          import os
          import time
          import requests
          from collections import defaultdict
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from fugle_marketdata import RestClient, FugleAPIError

          TW_TZ = ZoneInfo("Asia/Taipei")

          env_topic = os.environ.get("NTFY_TOPIC", "").strip()
          NTFY_TOPIC = env_topic if env_topic else "my_tw_stock_k82m"
          FUGLE_API_KEY = os.environ.get("FUGLE_API_KEY", "").strip()

          watchlist = [
              ("2606", "裕民", 68.0),
              ("1795", "美時", 102.0),
              ("2882", "國泰金", 105.5),
              ("1326", "台化", 63.0),
              ("3131", "弘塑", 1460.0),
              ("1312", "國喬", 10.3),
              ("1101", "台泥", 25.3),
          ]

          REST_MIN_INTERVAL = 2.4
          _last_call_ts = 0.0

          def safe_call(func, *args, **kwargs):
              global _last_call_ts
              wait = REST_MIN_INTERVAL - (time.monotonic() - _last_call_ts)
              if wait > 0:
                  time.sleep(wait)
              try:
                  res = func(*args, **kwargs)
                  _last_call_ts = time.monotonic()
                  return res
              except FugleAPIError as e:
                  _last_call_ts = time.monotonic()
                  if e.status_code == 429:
                      print("⚠️ 收到 HTTP 429，強制全域冷卻 65 秒...")
                      time.sleep(65)
                  raise

          def send_ntfy(title: str, body: str, priority: int = 4, tags=None):
              lines = body.splitlines()
              chunks, buf, buf_bytes = [], [], 0
              for line in lines:
                  lb = len((line + "\n").encode("utf-8"))
                  if buf and buf_bytes + lb > 2800:
                      chunks.append("\n".join(buf))
                      buf, buf_bytes = [line], lb
                  else:
                      buf.append(line)
                      buf_bytes += lb
              if buf:
                  chunks.append("\n".join(buf))

              total = len(chunks)
              for idx, chunk in enumerate(chunks, start=1):
                  part_title = f"{title} ({idx}/{total})" if total > 1 else title
                  try:
                      resp = requests.post(
                          "https://ntfy.sh/",
                          json={
                              "topic": NTFY_TOPIC,
                              "title": part_title,
                              "message": chunk,
                              "priority": priority,
                              "tags": tags or ["bar_chart"],
                          },
                          timeout=8,
                      )
                      print(f"📡 推播 ({idx}/{total}) HTTP {resp.status_code} | 頻道: {NTFY_TOPIC}")
                  except Exception as e:
                      print(f"⚠️ 推播異常 ({idx}/{total}): {e}")
                  if idx < total:
                      time.sleep(1.5)

          def get_risk_sets(stock_api):
              attention_set, disposition_set = set(), set()
              try:
                  res_att = safe_call(stock_api.intraday.tickers, type="EQUITY", isAttention=True)
                  attention_set = {item["symbol"] for item in res_att.get("data", []) if "symbol" in item}
              except FugleAPIError as e:
                  print(f"⚠️ 取得注意股清單失敗 ({e.status_code}): {e.response_text}")
              except Exception as e:
                  print(f"⚠️ 取得注意股清單失敗: {e}")

              try:
                  res_dis = safe_call(stock_api.intraday.tickers, type="EQUITY", isDisposition=True)
                  disposition_set = {item["symbol"] for item in res_dis.get("data", []) if "symbol" in item}
              except FugleAPIError as e:
                  print(f"⚠️ 取得處置股清單失敗 ({e.status_code}): {e.response_text}")
              except Exception as e:
                  print(f"⚠️ 取得處置股清單失敗: {e}")

              return attention_set, disposition_set

          def analyze_5m_ev(raw_bars: list) -> dict:
              """
              用近 25 天 5分K 回測『站穩VWAP + 突破15分箱頂 + 放量1.8倍』策略期望值
              固定扣 0.25% 台股當沖稅費；同時算出單分鐘建議爆量門檻(P95)
              """
              by_day = defaultdict(list)
              turnovers_1m = []

              for b in raw_bars:
                  d_str = b.get("date", "")
                  o, h, l, c, v = b.get("open"), b.get("high"), b.get("low"), b.get("close"), b.get("volume")
                  if not d_str or None in (o, h, l, c, v) or v <= 0 or c <= 0:
                      continue
                  by_day[d_str[:10]].append(b)
                  turnovers_1m.append((c * v) / 5.0)

              # 計算建議的單分鐘爆量門檻 (P95，保底 50 萬)
              p95_1m_wan = None
              if turnovers_1m:
                  turnovers_1m.sort()
                  idx95 = min(len(turnovers_1m) - 1, int(len(turnovers_1m) * 0.95))
                  p95_1m_wan = max(50.0, turnovers_1m[idx95] / 10_000.0)

              trades = []
              for day in sorted(by_day.keys()):
                  bars = sorted(by_day[day], key=lambda x: x["date"])
                  cum_pv, cum_vol = 0.0, 0.0
                  in_pos = False
                  entry_p = 0.0

                  for i, bar in enumerate(bars):
                      c, h, l, v = bar["close"], bar["high"], bar["low"], bar["volume"]
                      hhmm = bar["date"][11:16]
                      cum_pv += c * v
                      cum_vol += v
                      vwap = cum_pv / cum_vol if cum_vol > 0 else c

                      if in_pos:
                          if l <= entry_p * 0.985:
                              trades.append(-1.5 - 0.25)
                              break
                          if h >= entry_p * 1.030:
                              trades.append(3.0 - 0.25)
                              break
                          if hhmm >= "13:25" or i == len(bars) - 1:
                              raw_pct = ((c - entry_p) / entry_p) * 100.0
                              trades.append(raw_pct - 0.25)
                              break
                          continue

                      if i >= 6 and "09:15" <= hhmm <= "13:00":
                          box_15m = max(bars[k]["high"] for k in range(i - 3, i))
                          prev_c = bars[i - 1]["close"]
                          avg_vol = sum(bars[k]["volume"] for k in range(i - 6, i)) / 6.0
                          if prev_c <= box_15m and c > box_15m and c >= vwap and v >= avg_vol * 1.8:
                              in_pos = True
                              entry_p = c

              if not trades:
                  return {"count": 0, "ev": None, "win_rate": None, "p95_wan": p95_1m_wan}

              wins = [r for r in trades if r > 0]
              ev = sum(trades) / len(trades)
              win_rate = (len(wins) / len(trades)) * 100.0
              return {"count": len(trades), "ev": ev, "win_rate": win_rate, "p95_wan": p95_1m_wan}

          def is_tight_squeeze(valid_days: list) -> bool:
              """檢查近 3 日是否窄幅壓縮 (振幅 <= 3%) 且量縮 (最新日量 <= 5日均量 75%)"""
              if len(valid_days) < 5:
                  return False
              vols = [d.get("volume") or 0 for d in valid_days[:5]]
              avg_v5 = sum(vols) / 5.0
              if avg_v5 <= 0 or vols[0] > avg_v5 * 0.75:
                  return False
              for d in valid_days[:3]:
                  h, l, c = d.get("high"), d.get("low"), d.get("close")
                  if not (h and l and c) or ((h - l) / c * 100.0) > 3.2:
                      return False
              return True

          def main():
              if not FUGLE_API_KEY:
                  send_ntfy("❌ 週末戰情腳本異常", "未偵測到 FUGLE_API_KEY，請檢查 GitHub Secrets！", priority=5, tags=["warning"])
                  raise ValueError("❌ 未設定 FUGLE_API_KEY")

              now_tw = datetime.now(TW_TZ)
              now_str = now_tw.strftime("%Y-%m-%d %H:%M")
              from_date = (now_tw.date() - timedelta(days=25)).strftime("%Y-%m-%d")
              to_date = now_tw.date().strftime("%Y-%m-%d")

              print(f"🚀 啟動週末/盤後期望值分析 ({now_str} TW)...")
              client = RestClient(api_key=FUGLE_API_KEY)
              stock_api = client.stock

              attention_set, disposition_set = get_risk_sets(stock_api)
              risk_lines = []
              over_res, near_res, far_res = [], [], []
              suggested_list = []

              for code, name_cfg, res_p in watchlist:
                  try:
                      # 1. 52週統計
                      stats = safe_call(stock_api.historical.stats, symbol=code)
                      name = stats.get("name") or name_cfg
                      close_p = stats.get("closePrice")
                      val_yi = (stats.get("tradeValue") or 0) / 1e8

                      # 2. 近 25 天日K (算 5MA、10日高、量縮壓縮)
                      candles_d = safe_call(
                          stock_api.historical.candles,
                          symbol=code,
                          **{"from": from_date, "to": to_date, "timeframe": "D"},
                      )
                      valid_days = [d for d in candles_d.get("data", []) if d.get("close") is not None]
                      latest_day = valid_days[0].get("date", "") if valid_days else ""

                      if close_p is None and valid_days:
                          close_p = valid_days[0]["close"]

                      ma5 = sum(d["close"] for d in valid_days[:5]) / 5 if len(valid_days) >= 5 else None
                      high_10d = max((d["high"] for d in valid_days[:10] if d.get("high") is not None), default=None)
                      squeeze_tag = " ⚡蓄勢壓縮" if is_tight_squeeze(valid_days) else ""

                      # 3. 近 25 天 5分K (算扣稅後策略期望值 + P95 建議爆量門檻)
                      candles_5m = safe_call(
                          stock_api.historical.candles,
                          symbol=code,
                          **{"from": from_date, "to": to_date, "timeframe": "5"},
                      )
                      ev_info = analyze_5m_ev(candles_5m.get("data", []))

                      # 4. 最新收盤快照 (VWAP + 外盤比 + 漲跌幅)
                      q = safe_call(stock_api.intraday.quote, symbol=code)
                      q_date = q.get("date", "")
                      q_valid = bool(q_date and (not latest_day or q_date == latest_day))

                      vwap = q.get("avgPrice") if q_valid else None
                      outer_pct = None
                      chg_pct = q.get("changePercent") if q_valid else None
                      if chg_pct is None:
                          chg_pct = stats.get("changePercent")
                      if chg_pct is None and len(valid_days) >= 2:
                          prev_c = valid_days[1].get("close")
                          if close_p is not None and prev_c:
                              chg_pct = ((close_p - prev_c) / prev_c) * 100

                      if q_valid:
                          total = q.get("total") or {}
                          ask_v = float(total.get("tradeVolumeAtAsk") or 0)
                          bid_v = float(total.get("tradeVolumeAtBid") or 0)
                          if (ask_v + bid_v) > 0:
                              outer_pct = (ask_v / (ask_v + bid_v)) * 100

                      flag = ""
                      if code in disposition_set:
                          flag = " 🚫處置"
                          risk_lines.append(f"🚫 {code} {name}（處置股）")
                      elif code in attention_set:
                          flag = " ⚠️注意"
                          risk_lines.append(f"⚠️ {code} {name}（注意股）")

                      chg_str = f"{chg_pct:+.2f}%" if chg_pct is not None else "NA"
                      ma5_str = (f"站5MA({ma5:.1f})" if close_p >= ma5 else f"破5MA({ma5:.1f})") if (close_p and ma5) else "5MA:NA"
                      vwap_str = ("站VWAP" if close_p >= vwap else "破VWAP") if (close_p and vwap) else "VWAP:NA"

                      if outer_pct is None:
                          out_badge = "外盤:NA"
                      elif outer_pct >= 60:
                          out_badge = f"🔥外盤{outer_pct:.1f}%"
                      elif outer_pct <= 40:
                          out_badge = f"❄️外盤{outer_pct:.1f}%"
                      else:
                          out_badge = f"外盤{outer_pct:.1f}%"

                      if ev_info["ev"] is not None:
                          ev_icon = "✅" if ev_info["ev"] > 0 else "❌"
                          ev_str = f"{ev_icon}EV {ev_info['ev']:+.2f}% (勝{ev_info['win_rate']:.0f}%/{ev_info['count']}次)"
                      else:
                          ev_str = "EV無樣本"

                      p95_str = f"爆量>{ev_info['p95_wan']:.0f}萬" if ev_info["p95_wan"] else ""
                      h10_str = f"{high_10d}" if high_10d is not None else "NA"
                      dist_res = ((res_p - close_p) / close_p * 100) if (close_p and res_p) else None

                      # 產生建議新 watchlist 值
                      new_res = res_p
                      note = ""
                      if dist_res is not None and dist_res <= 0:
                          new_res = round(high_10d, 2) if (high_10d and high_10d > close_p) else round(close_p * 1.03, 1)
                          note = f" #原{res_p}"
                      suggested_list.append(f'("{code}", "{name}", {new_res}),{note}')

                      if dist_res is not None and dist_res <= 0:
                          block = (
                              f"• {code} {name}{flag}{squeeze_tag}：收 {close_p} ({chg_str}) | {val_yi:.1f}億\n"
                              f"  👉 已過舊頂 {res_p}！改盯 {new_res} (10日高 {h10_str})\n"
                              f"  👉 {ev_str} | {p95_str}\n"
                              f"  👉 {ma5_str} | {vwap_str} | {out_badge}"
                          )
                          over_res.append(block)
                      elif dist_res is not None and dist_res <= 5.0:
                          block = (
                              f"• {code} {name}{flag}{squeeze_tag}：收 {close_p} ({chg_str}) | {val_yi:.1f}億\n"
                              f"  👉 離頂 {res_p} 差 +{dist_res:.1f}% ({out_badge})\n"
                              f"  👉 {ev_str} | {p95_str}\n"
                              f"  👉 {ma5_str} | {vwap_str} | 10日高 {h10_str}"
                          )
                          near_res.append((dist_res, block))
                      else:
                          dist_txt = f"距頂+{dist_res:.1f}%" if dist_res is not None else "距頂:NA"
                          far_res.append(f"• {code} {name}{flag}{squeeze_tag} {close_p} ({chg_str}) | {dist_txt} | {ev_str}")

                      print(f"✅ 完成 {code} {name} | {ev_str}")

                  except FugleAPIError as e:
                      print(f"⚠️ [{code}] API 錯誤 ({e.status_code}): {e.response_text}")
                      far_res.append(f"• {code} {name_cfg}：API 錯誤 ({e.status_code})")
                  except Exception as e:
                      print(f"⚠️ [{code}] 例外錯誤: {e}")
                      far_res.append(f"• {code} {name_cfg}：讀取異常")

              near_res.sort(key=lambda x: x[0])

              sections = [f"資料基準：{now_str} TW (42%低載/含扣稅EV)\n"]
              sections.append(("【⚠️ 掃雷】\n" + "\n".join(risk_lines) + "\n") if risk_lines else "【✅ 掃雷】無注意/處置股\n")

              if over_res:
                  sections.append("【⚠️ 舊頂過時！週一記得調高】\n" + "\n".join(over_res) + "\n")
              if near_res:
                  sections.append("【🔥 準備撞頂！距設定頂 ≤ 5%】\n" + "\n".join(b for _, b in near_res) + "\n")
              if far_res:
                  sections.append("【💤 離頂較遠 (>5%)】\n" + "\n".join(far_res) + "\n")

              sections.append("【📋 週一建議清單(可直接貼回radar)】\n" + "\n".join(suggested_list))

              send_ntfy(
                  title="📋 週一備戰與期望值地圖",
                  body="\n".join(sections),
                  priority=4,
                  tags=["clipboard", "chart_with_upwards_trend"],
              )

          if __name__ == "__main__":
              main()
          EOF
          python -u run_weekend.py
