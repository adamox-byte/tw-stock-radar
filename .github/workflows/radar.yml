name: TW Stock Intraday Radar

on:
  schedule:
    # 台灣時間週一至週五 08:45 自動開機 (UTC 00:45)
    - cron: '45 0 * * 1-5'
  workflow_dispatch: # 支援手動按按鈕隨時測試開機

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v4

      - name: 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝富果與網路套件
        run: |
          pip install fugle-marketdata requests tzdata

      - name: 啟動機構級盯盤雷達
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -f "stock_radar.py" ]; then
            python -u stock_radar.py
          else
            python -u tw-stock-radar/stock_radar.py
          fi
